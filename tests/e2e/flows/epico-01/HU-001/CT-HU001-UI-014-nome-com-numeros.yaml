# CT-HU001-UI-014 — Nome com números
# Caso manual: tests/manual/epico-01/HU-001/ui/UI-HU-001.md#ct-hu001-ui-014--nome-com-números
appId: com.gouce.app
name: "CT-HU001-UI-014 — Nome com números"
tags:
  - hu-001
  - regressao
---
- runFlow: ../../../subflows/cadastro/abrir-cadastro.yaml
- runFlow:
    file: ../../../subflows/cadastro/preencher-dados-basicos.yaml
    env:
      NOME: ""
      DATA_NASCIMENTO: "01012000"
      EMAIL: "maria.e2e@teste.com"
      SENHA: "Senha123"
      CONFIRMAR_SENHA: "Senha123"

# --- "Maria123 Silva" ---
- runFlow:
    file: ../../../subflows/cadastro/redigitar-campo.yaml
    env:
      CAMPO_ID: "cadastro-input-nome"
      VALOR: "Maria123 Silva"
- runFlow:
    file: ../../../subflows/cadastro/deve-bloquear-passo-1.yaml
    env:
      ERRO_ID: "cadastro-erro-nome"
      MENSAGEM: "O nome deve conter apenas letras e espaços"

# --- "123456 789" ---
- runFlow:
    file: ../../../subflows/cadastro/redigitar-campo.yaml
    env:
      CAMPO_ID: "cadastro-input-nome"
      VALOR: "123456 789"
- runFlow:
    file: ../../../subflows/cadastro/deve-bloquear-passo-1.yaml
    env:
      ERRO_ID: "cadastro-erro-nome"
      MENSAGEM: "O nome deve conter apenas letras e espaços"
