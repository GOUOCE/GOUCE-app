# CT-HU001-UI-009 — Dados básicos obrigatórios
# Caso manual: tests/manual/epico-01/HU-001/ui/UI-HU-001.md#ct-hu001-ui-009--dados-básicos-obrigatórios
#
# Para cada campo do Passo 1: deixa só ele vazio, toca em Próximo e confere que
# o app continua no Passo 1 e mostra o erro naquele campo.
appId: com.gouce.app
name: "CT-HU001-UI-009 — Dados básicos obrigatórios"
tags:
  - hu-001
  - regressao
env:
  NOME_VALIDO: "Maria da Silva"
  DATA_VALIDA: "01012000"
  EMAIL_VALIDO: "maria.e2e@teste.com"
  SENHA_VALIDA: "Senha123"
---
# --- Nome vazio ---
- runFlow: ../../../subflows/cadastro/abrir-cadastro.yaml
- runFlow:
    file: ../../../subflows/cadastro/preencher-dados-basicos.yaml
    env:
      NOME: ""
      DATA_NASCIMENTO: ${DATA_VALIDA}
      EMAIL: ${EMAIL_VALIDO}
      SENHA: ${SENHA_VALIDA}
      CONFIRMAR_SENHA: ${SENHA_VALIDA}
- tapOn:
    id: "cadastro-btn-proximo"
- assertVisible:
    id: "cadastro-txt-passo"
    text: "Passo 1 de 4.*"
- scrollUntilVisible:
    element:
      id: "cadastro-erro-nome"
    direction: UP

# --- Data de nascimento vazia ---
- runFlow: ../../../subflows/cadastro/abrir-cadastro.yaml
- runFlow:
    file: ../../../subflows/cadastro/preencher-dados-basicos.yaml
    env:
      NOME: ${NOME_VALIDO}
      DATA_NASCIMENTO: ""
      EMAIL: ${EMAIL_VALIDO}
      SENHA: ${SENHA_VALIDA}
      CONFIRMAR_SENHA: ${SENHA_VALIDA}
- tapOn:
    id: "cadastro-btn-proximo"
- assertVisible:
    id: "cadastro-txt-passo"
    text: "Passo 1 de 4.*"
- scrollUntilVisible:
    element:
      id: "cadastro-erro-data-nascimento"
    direction: UP

# --- E-mail vazio ---
- runFlow: ../../../subflows/cadastro/abrir-cadastro.yaml
- runFlow:
    file: ../../../subflows/cadastro/preencher-dados-basicos.yaml
    env:
      NOME: ${NOME_VALIDO}
      DATA_NASCIMENTO: ${DATA_VALIDA}
      EMAIL: ""
      SENHA: ${SENHA_VALIDA}
      CONFIRMAR_SENHA: ${SENHA_VALIDA}
- tapOn:
    id: "cadastro-btn-proximo"
- assertVisible:
    id: "cadastro-txt-passo"
    text: "Passo 1 de 4.*"
- scrollUntilVisible:
    element:
      id: "cadastro-erro-email"
    direction: UP

# --- Senha vazia ---
- runFlow: ../../../subflows/cadastro/abrir-cadastro.yaml
- runFlow:
    file: ../../../subflows/cadastro/preencher-dados-basicos.yaml
    env:
      NOME: ${NOME_VALIDO}
      DATA_NASCIMENTO: ${DATA_VALIDA}
      EMAIL: ${EMAIL_VALIDO}
      SENHA: ""
      CONFIRMAR_SENHA: ${SENHA_VALIDA}
- tapOn:
    id: "cadastro-btn-proximo"
- assertVisible:
    id: "cadastro-txt-passo"
    text: "Passo 1 de 4.*"
- scrollUntilVisible:
    element:
      id: "cadastro-erro-senha"

# --- Confirmação de senha vazia ---
- runFlow: ../../../subflows/cadastro/abrir-cadastro.yaml
- runFlow:
    file: ../../../subflows/cadastro/preencher-dados-basicos.yaml
    env:
      NOME: ${NOME_VALIDO}
      DATA_NASCIMENTO: ${DATA_VALIDA}
      EMAIL: ${EMAIL_VALIDO}
      SENHA: ${SENHA_VALIDA}
      CONFIRMAR_SENHA: ""
- tapOn:
    id: "cadastro-btn-proximo"
- assertVisible:
    id: "cadastro-txt-passo"
    text: "Passo 1 de 4.*"
- scrollUntilVisible:
    element:
      id: "cadastro-erro-confirmar-senha"
